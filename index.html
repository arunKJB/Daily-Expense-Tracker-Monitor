<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <meta name="description" content="Daily Expense Tracker - Record and monitor your daily expenses">
    <title>Daily Expense Tracker</title>
    <link rel="icon" type="image/png" href="https://i.pinimg.com/736x/ff/e5/c8/ffe5c8bfff56af5eb39a3f13dd4bde26.jpg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="index">

<main class="container main-container">

    <div class="page-head">
        <div>
            <h1>Add Expense</h1>
            <p>Record today's spending in a few taps</p>
        </div>
        <div class="actions">
            <span class="tag"><i class="fa-solid fa-hashtag"></i> Entry <span id="serialNo">-</span></span>
        </div>
    </div>

    <div class="card-x">
        <form id="expenseForm" novalidate>
            <div class="row g-3">

                <!-- CREATOR (dropdown + add) -->
                <div class="col-12 col-md-6 col-lg-4">
                    <label class="form-label" for="creator">Creator <span class="required-star">*</span></label>
                    <div class="input-group">
                        <select class="form-select" id="creator" required>
                            <option value="">Loading...</option>
                        </select>
                        <button type="button" class="btn btn-outline-primary" id="addCreatorBtn" title="Add new creator">
                            <i class="fa-solid fa-user-plus"></i> <span>Add</span>
                        </button>
                    </div>
                </div>

                <div class="col-6 col-md-3 col-lg-4">
                    <label class="form-label" for="expenseDate">Date <span class="required-star">*</span></label>
                    <input type="date" class="form-control" id="expenseDate" required>
                </div>

                <div class="col-6 col-md-3 col-lg-4">
                    <label class="form-label" for="expenseTime">Time</label>
                    <input type="time" class="form-control" id="expenseTime">
                </div>

                <!-- EXPENSE TYPE -->
                <div class="col-12 col-md-6">
                    <label class="form-label" for="expenseType">Expense Type <span class="required-star">*</span></label>
                    <div class="input-group">
                        <select class="form-select" id="expenseType" required>
                            <option value="">Loading...</option>
                        </select>
                        <button type="button" class="btn btn-outline-primary" id="addExpenseTypeBtn" title="Add new expense type">
                            <i class="fa-solid fa-plus"></i> <span>Add</span>
                        </button>
                    </div>
                </div>

                <div class="col-12 col-md-6">
                    <label class="form-label" for="category">Category <span class="required-star">*</span></label>
                    <select class="form-select" id="category" required></select>
                </div>

                <div class="col-12 col-lg-8">
                    <label class="form-label" for="comment">Description <span class=""></span></label>
                    <textarea class="form-control" id="comment" rows="3" maxlength="1000" placeholder="Enter expense details..." required></textarea>
                </div>

                <div class="col-12 col-lg-4">
                    <label class="form-label" for="amount">Amount <span class="required-star">*</span></label>
                    <div class="amount-input">
                        <span>₹</span>
                        <input type="number" class="form-control" id="amount" placeholder="0.00" min="0.01" step="0.01" inputmode="decimal" required>
                    </div>
                </div>
            </div>

            <div class="d-flex flex-wrap gap-2 mt-4">
                <button type="submit" class="btn btn-primary btn-lg-x flex-grow-1 flex-md-grow-0" id="submitExpenseBtn">
                    <i class="fa-solid fa-floppy-disk me-1"></i> Save Expense
                </button>
                <a href="expense.html" class="btn btn-soft btn-lg-x"><i class="fa-solid fa-table-list me-1"></i> View Expenses</a>
            </div>
        </form>
    </div>
</main>

<!-- ADD CREATOR MODAL -->
<div class="modal fade" id="addCreatorModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fa-solid fa-user-plus text-primary me-2"></i>Add New Creator</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <label for="newCreatorName" class="form-label">Creator name</label>
                <input type="text" id="newCreatorName" class="form-control" maxlength="60" placeholder="Example: Kumar" autocomplete="off">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-soft" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="saveCreatorBtn"><i class="fa-solid fa-plus me-1"></i> Add Creator</button>
            </div>
        </div>
    </div>
</div>

<!-- ADD EXPENSE TYPE MODAL -->
<div class="modal fade" id="addExpenseTypeModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fa-solid fa-tags text-primary me-2"></i>Add New Expense Type</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <label for="newExpenseType" class="form-label">Expense type</label>
                <input type="text" id="newExpenseType" class="form-control" maxlength="100" placeholder="Example: House Maintenance" autocomplete="off">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-soft" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="saveExpenseTypeBtn"><i class="fa-solid fa-plus me-1"></i> Add Type</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="index.js"></script>
</body>
</html>
